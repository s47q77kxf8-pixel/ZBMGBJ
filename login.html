<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>账号登录</title>
    <link rel="stylesheet" href="style.css?v=20250131-process-input">
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
        }
        .page-wrap {
            max-width: 520px;
            margin: 0 auto;
            padding: 16px 14px 28px;
        }
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 8px 0 14px;
        }
        .topbar-title {
            font-size: 22px;
            font-weight: 800;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px;
        }
        .form-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .form-group {
            flex: 1;
            min-width: 220px;
            position: relative;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--text-light);
            margin: 0 0 6px;
        }
        .form-group input {
            width: 100%;
            box-sizing: border-box;
        }
        .password-toggle {
            position: absolute;
            right: 8px;
            bottom: 6px;
            background: none;
            border: none;
            padding: 4px;
            cursor: pointer;
            color: var(--text-light);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .password-toggle:hover {
            color: var(--text);
        }
        .password-toggle svg {
            width: 16px;
            height: 16px;
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }
        .actions .btn {
            flex: 1;
        }
        #message {
            margin-top: 10px;
            text-align: center;
            font-size: 12px;
            color: var(--text-light);
            min-height: 1.2em;
        }
        #message.error { color: var(--danger, #e74c3c); }
        #message.success { color: var(--ok, #2ecc71); }
    </style>
</head>
<body>

<div class="page-wrap">
    <div class="topbar">
        <button type="button" class="btn-icon" onclick="window.location.href='index.html#settings'" aria-label="返回" title="返回">
            <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="topbar-title">账号登录</div>
        <span style="width: 40px;"></span>
    </div>

    <div class="card">
        <div class="form-row">
            <div class="form-group">
                <label for="email">邮箱</label>
                <input type="email" id="email" placeholder="your@email.com" autocomplete="email" autocapitalize="none" spellcheck="false">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" placeholder="至少6位密码" autocomplete="current-password" autocapitalize="none" spellcheck="false">
                <button type="button" class="password-toggle" onclick="togglePasswordVisibility('password', this)" aria-label="显示或隐藏密码" title="显示/隐藏密码">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                </button>
            </div>
        </div>
        <div class="actions">
            <button type="button" class="btn" id="btnLogin" onclick="handleAuth('login')">登录</button>
            <button type="button" class="btn secondary" onclick="handleAuth('signup')">注册账号</button>
        </div>
        <div style="margin-top:10px;text-align:center;">
            <a href="#" id="linkForgot" onclick="requestPasswordReset(); return false;" style="font-size:12px;color:var(--primary);text-decoration:underline;">忘记密码？</a>
        </div>
        <div style="margin-top:6px;text-align:center;">
            <a href="#" onclick="runLoginDiagnosis(); return false;" style="font-size:12px;color:var(--text-light,#6b7280);text-decoration:underline;">登录不了？点这里诊断</a>
        </div>
        <div style="margin-top:6px;text-align:center;">
            <a href="netcheck.html" style="font-size:12px;color:var(--text-light,#6b7280);text-decoration:underline;">网络连通性自检（换网络/换设备都登不上时用）</a>
        </div>
        <div id="message"></div>
    </div>
</div>

<!-- 本地内置 Supabase SDK（避免依赖 cdn.jsdelivr.net，海外 CDN 在国内网络常被拦截） -->
<script src="vendor/supabase-js.umd.min.js?v=2.58.0"></script>
<script src="storage.js?v=20261018-0001"></script>
<script src="supabase-config.js?v=20250213"></script>
<script>
    // 使用全局配置的 Supabase 客户端（避免重复声明）
    // 注意：使用 supabaseClient 而不是 supabase，避免与可能的全局变量冲突
    var supabaseClient = null;
    (function() {
        if (window.__SUPABASE__ && window.__SUPABASE__.client) {
            supabaseClient = window.__SUPABASE__.client;
        } else {
            console.error('Supabase 客户端初始化失败');
        }
    })();

    const messageEl = document.getElementById('message');

    function showMessage(msg, type = 'success') {
        messageEl.textContent = msg;
        messageEl.className = 'message ' + type;
    }

    // 将 Supabase 返回的英文报错翻译为中文提示；未收录的保留原文
    function translateAuthError(message) {
        if (!message) return '未知错误';
        const msg = String(message);
        if (msg.includes('Invalid login credentials')) return '邮箱或密码不正确。请检查输入（密码区分大小写）；若尚未注册，请先点击「注册账号」；忘记密码可点击下方「忘记密码？」重置';
        if (msg.includes('Email not confirmed')) return '邮箱未验证，请先查收验证邮件（注意垃圾箱）后再登录';
        if (msg.includes('already registered') || msg.includes('already been registered')) return '该邮箱已注册，请直接登录；忘记密码可点击「忘记密码？」重置';
        if (msg.includes('Password should be at least')) return '密码太短，至少需要 6 位';
        if (msg.includes('Signups not allowed')) return '当前未开放注册，请联系管理员';
        if (msg.includes('Unable to validate email address') || msg.toLowerCase().includes('invalid format')) return '邮箱格式不正确，请检查后重试';
        if (msg.toLowerCase().includes('rate limit') || msg.includes('every 60 seconds') || msg.includes('Too many requests')) return '操作过于频繁，请稍等一分钟后再试';
        const secMatch = msg.match(/you can only request this after (\d+)\s*seconds?/i);
        if (secMatch) return '操作过于频繁，请等待 ' + secMatch[1] + ' 秒后再试（该邮箱的邮件发送有频率限制，期间重复点击无效）';
        if (msg.includes('Email link is invalid or has expired') || msg.includes('Token has expired')) return '链接无效或已过期，请重新发起重置密码';
        if (msg.includes('New password should be different')) return '新密码不能与旧密码相同';
        if (msg.includes('Failed to fetch') || msg.includes('Load failed') || msg.includes('NetworkError') || msg.includes('fetch failed') || msg.includes('Network request failed') || msg.toLowerCase().includes('networkerror')) return '网络连接异常，浏览器未能连上服务器。常见原因：当前网络无法访问云端服务、代理/VPN 未开启或节点不可用、浏览器广告拦截插件拦截了请求。请切换网络或开启代理后重试';
        if (/exceeded the quota|QuotaExceeded|storage quota/i.test(msg)) return '本地存储已满（localStorage 超过约 5MB 配额），登录令牌写不进去导致无法登录。请在浏览器按 F12 打开控制台，执行 Object.entries(localStorage).map(([k,v])=>[k,v.length]).sort((a,b)=>b[1]-a[1]).slice(0,10) 先查看各键占用，删掉体积最大的键（多是图片/案例缓存）后重试；或清除本浏览器对该站点的数据（会清掉未同步的本地数据）';
        return msg;
    }

    function togglePasswordVisibility(id, btn) {
        const input = document.getElementById(id);
        if (input.type === 'password') {
            input.type = 'text';
            btn.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.586 10.586a2 2 0 1 1 2.828 2.828" fill="none" stroke="currentColor" stroke-width="2"/><path d="m17.94 17.94-2.12-2.12M9.88 9.88l-2.12-2.12M12 5c7 0 10 7 10 7s-1 2-3 4M2 12s3-7 10-7M5 19 19 5" fill="none" stroke="currentColor" stroke-width="2"/></svg>';
        } else {
            input.type = 'password';
            btn.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" fill="none" stroke="currentColor" stroke-width="2"/></svg>';
        }
    }

    function setBtnLoading(loading) {
        const btns = ['btnLogin', 'btnSignup', 'linkForgot'].map(id => document.getElementById(id));
        btns.forEach(b => {
            if (!b) return;
            b.disabled = loading;
            if (b.tagName === 'A') {
                b.style.pointerEvents = loading ? 'none' : 'auto';
                b.style.opacity = loading ? '0.5' : '1';
            }
        });
    }

    async function handleAuth(type) {
        if (!supabaseClient) {
            return showMessage(initFailureMessage(), 'error');
        }
        
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        if (!email || !password) {
            return showMessage('请填写完整信息', 'error');
        }

        setBtnLoading(true);
        showMessage('处理中...', 'success');

        try {
            if (type === 'signup') {
                // 1. 注册逻辑
                const { data, error } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password
                });

                if (error) {
                    setBtnLoading(false);
                    return showMessage(translateAuthError(error.message), 'error');
                }

                // 2. 强制登录以确保拿到 Session
                showMessage('注册成功，正在建立安全连接...', 'success');
                const { data: signInData, error: signInErr } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (signInErr) {
                    setBtnLoading(false);
                    return showMessage('注册成功，但自动登录失败：' + translateAuthError(signInErr.message) + '。请尝试手动登录。', 'error');
                }

                const session = signInData.session;
                if (!session || !session.access_token) {
                    setBtnLoading(false);
                    return showMessage('注册成功，但未能获取到安全令牌，请尝试重新登录', 'error');
                }

                // 3. 调用 Edge Function 自动建档
                showMessage('身份验证成功，正在初始化档案...', 'success');
                const fnUrl = window.__SUPABASE__.SUPABASE_URL.replace(/\/$/, '') + '/functions/v1/swift-function';

                try {
                    const resp = await fetch(fnUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': 'Bearer ' + session.access_token
                        },
                        body: JSON.stringify({})
                    });

                    const payload = await resp.json().catch(() => ({}));

                    if (!resp.ok || !payload || payload.ok !== true) {
                        const detail = payload && (payload.detail || payload.error || payload.message);
                        throw new Error(detail || ('HTTP ' + resp.status));
                    }

                    showMessage('所有初始化已完成！正在进入系统...', 'success');
                    setTimeout(() => window.location.href = 'index.html#settings', 800);
                } catch (e) {
                    setBtnLoading(false);
                    console.error('建档失败:', e);
                    showMessage('档案初始化失败：' + (e && e.message ? e.message : '网络错误') + '。请联系管理员', 'error');
                }
            } else {
                // 登录逻辑
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    setBtnLoading(false);
                    if (error.message.includes('Email not confirmed')) {
                        messageEl.innerHTML = `登录失败: 邮箱未验证。<br><a href="#" onclick="resendEmail('${email}')" style="color:var(--primary);text-decoration:underline;">重新发送验证邮件</a>`;
                        messageEl.className = 'message error';
                        return;
                    }
                    return showMessage('登录失败：' + translateAuthError(error.message), 'error');
                }

                showMessage('登录成功！正在同步安全连接...', 'success');
                // 确保 session 已写入存储
                await supabaseClient.auth.getSession();
                setTimeout(() => {
                    // 使用 replace 避免在 iOS 上点击后退返回到登录页的问题
                    window.location.replace('index.html#settings');
                }, 600);
            }
        } catch (e) {
            setBtnLoading(false);
            showMessage('请求异常：' + (e && e.message ? translateAuthError(e.message) : '未知错误'), 'error');
        }
    }

    async function resendEmail(email) {
        if (!supabaseClient) return;
        showMessage('正在重发验证邮件...', 'success');
        const { error } = await supabaseClient.auth.resend({
            type: 'signup',
            email: email,
            options: {
                emailRedirectTo: window.location.origin + window.location.pathname
            }
        });
        if (error) showMessage('重发失败：' + translateAuthError(error.message), 'error');
        else showMessage('验证邮件已重发，请查收', 'success');
    }

    async function requestPasswordReset() {
        if (!supabaseClient) {
            return showMessage(initFailureMessage(), 'error');
        }

        const email = document.getElementById('email').value;
        if (!email) {
            return showMessage('请先填写邮箱', 'error');
        }

        setBtnLoading(true);
        showMessage('正在发送重置密码邮件...', 'success');

        try {
            const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                redirectTo: window.location.origin + window.location.pathname.replace(/[^\/]*$/, 'reset-password.html')
            });

            if (error) {
                setBtnLoading(false);
                return showMessage('发送失败：' + translateAuthError(error.message), 'error');
            }

            setBtnLoading(false);
            showMessage('已发送重置密码邮件，请去邮箱按提示修改密码（可能在垃圾箱）', 'success');
        } catch (e) {
            setBtnLoading(false);
            return showMessage('发送失败：' + (e && e.message ? translateAuthError(e.message) : '网络错误'), 'error');
        }
    }

    // 初始化失败时给出具体原因，方便用户/开发者定位
    function initFailureMessage() {
        if (!window.supabase || typeof window.supabase.createClient !== 'function') {
            return '登录失败：Supabase SDK 未加载（vendor/supabase-js.umd.min.js 缺失或加载失败）。请确认部署包含 vendor 目录，或点「登录不了？点这里诊断」查看详情';
        }
        if (!window.__SUPABASE__) {
            return '登录失败：配置文件 supabase-config.js 未加载。请点「登录不了？点这里诊断」查看详情';
        }
        return '登录失败：客户端初始化异常（配置不完整）。请点「登录不了？点这里诊断」查看详情';
    }

    // 一键诊断：逐项检查 SDK、配置、客户端与云端连通性，并在页面上给出结论（可截图回传）
    async function runLoginDiagnosis() {
        var mark = function (good) { return good ? '✅' : '❌'; };

        var sdkOk = !!(window.supabase && typeof window.supabase.createClient === 'function');
        var conf = window.__SUPABASE__ || null;
        var confOk = !!(conf && conf.SUPABASE_URL && conf.SUPABASE_ANON_KEY);
        var clientOk = !!supabaseClient;

        // 通用连通性探测：对照组一律用 no-cors —— 拿不到状态码，但能区分「网络层到底通不通」，
        // 避免把 CORS 拒绝误判成「网络故障」（二者在浏览器里都表现为 Failed to fetch）
        async function probeUrl(url, opt) {
            opt = opt || {};
            var timeoutMs = opt.timeoutMs || 8000;
            var ctl = ('AbortController' in window) ? new AbortController() : null;
            var tid = null;
            var t0 = Date.now();
            try {
                if (ctl) tid = setTimeout(function () { ctl.abort(); }, timeoutMs);
                var init = { method: 'GET', cache: 'no-store', signal: ctl ? ctl.signal : undefined };
                if (opt.noCors) init.mode = 'no-cors';
                if (opt.headers) init.headers = opt.headers;
                var res = await fetch(url, init);
                return { ok: true, ms: Date.now() - t0, status: res.status, opaque: res.type === 'opaque' };
            } catch (e) {
                var aborted = !!(e && e.name === 'AbortError');
                return {
                    ok: false,
                    ms: Date.now() - t0,
                    aborted: aborted,
                    text: aborted ? ('超时（' + Math.round(timeoutMs / 1000) + ' 秒无响应）') : (e && e.message ? e.message : String(e))
                };
            } finally {
                if (tid) clearTimeout(tid);
            }
        }

        var conn = null, cfConn = null, domConn = null, noCorsConn = null;
        if (confOk) {
            var base = String(conf.SUPABASE_URL).replace(/\/$/, '');
            conn = { base: base, ok: false, text: '' };
            var r = await probeUrl(base + '/auth/v1/health', {
                timeoutMs: 8000,
                headers: { apikey: conf.SUPABASE_ANON_KEY, Authorization: 'Bearer ' + conf.SUPABASE_ANON_KEY }
            });
            if (r.ok) {
                // 只要能拿到 HTTP 响应就说明服务「可达」；非 2xx 多为密钥/权限或限流，不算连接失败
                conn.ok = true;
                conn.text = 'HTTP ' + r.status + '（' + r.ms + 'ms）' + ((r.status >= 200 && r.status < 300) ? '，可正常访问' : '，服务可达（非 2xx，通常为密钥/权限或限流）');
            } else {
                conn.ok = false;
                conn.text = '连接失败 —— ' + r.text + '（' + r.ms + 'ms）';
                // 带鉴权头失败后，再用 no-cors 探一次同一个地址：
                // 能通 → 网络没问题，是跨域/插件拦截；还是失败 → 网络层确实到不了
                noCorsConn = await probeUrl(base + '/auth/v1/health', { noCors: true, timeoutMs: 8000 });
            }
            // 对照组：①同 CDN（Cloudflare，本项目后端就架在它上面）②国内基础站点
            cfConn = await probeUrl('https://www.cloudflare.com/', { noCors: true, timeoutMs: 6000 });
            domConn = await probeUrl('https://www.baidu.com/', { noCors: true, timeoutMs: 6000 });
        }

        var lines = [];
        lines.push('【登录故障诊断】' + new Date().toLocaleString());
        // navigator.onLine 只代表「网卡没被禁用」，网络被拦时它照样是 true，所以这里不再拿它下结论
        lines.push(mark(navigator.onLine) + ' 设备网络状态：' + (navigator.onLine ? '在线（仅表示网卡未禁用，不代表能出网）' : '离线'));
        lines.push(mark(sdkOk) + ' Supabase SDK：' + (sdkOk ? '已加载' : '未加载（vendor/supabase-js.umd.min.js 缺失或加载失败）'));
        lines.push(mark(confOk) + ' 配置文件 supabase-config.js：' + (confOk ? '已加载' : '缺失或内容不完整'));
        lines.push(mark(clientOk) + ' 客户端初始化 supabaseClient：' + (clientOk ? '成功' : '失败'));
        if (conn) {
            lines.push(mark(conn.ok) + ' 云端连通性 ' + conn.base + '：' + conn.text);
            if (!conn.ok) {
                var cfOk = !!(cfConn && cfConn.ok);
                var domOk = !!(domConn && domConn.ok);
                lines.push('   → 对照测试：Cloudflare 官网 ' + mark(cfOk) + (cfOk ? ' 可访问' : ' 不可访问')
                    + '　百度 ' + mark(domOk) + (domOk ? ' 可访问' : ' 不可访问'));
                if (noCorsConn && noCorsConn.ok) {
                    lines.push('   → 判断：网络其实是通的，请求是在浏览器里被拦下的（跨域限制或扩展/安全软件拦截）');
                    lines.push('   → 处理：先开「无痕窗口」重试；仍不行请关闭广告拦截/隐私类扩展，或换一个浏览器');
                } else if (cfOk && domOk) {
                    lines.push('   → 判断：你的基础网络是通的，只有这个 Supabase 域名连不上（换电脑、换手机都一样，说明与设备无关）');
                    lines.push('   → 常见原因：①该域名在当前网络被拦截（国内直连 *.supabase.co 常年不稳定）②代理/安全软件的规则把它劫持了');
                    lines.push('   → 处理顺序：换网络（手机流量）试 → 开启代理/VPN 后重试 → 仍不行请联系开发者更换后端地址');
                } else if (domOk) {
                    lines.push('   → 判断：能上网，但访问 Cloudflare 线路不通；本工具的后端就架在 Cloudflare 上');
                    lines.push('   → 处理：开启代理/VPN（或切换可用节点）后重试；已经在用代理的请换个节点再试');
                } else {
                    lines.push('   → 判断：当前网络整体无法出网（连国内基础站点也打不开）');
                    lines.push('   → 处理：检查 Wi-Fi/网线；若正在使用代理/VPN，请先关闭它再试（代理配错会把所有请求一起拦死）');
                }
            }
        } else if (!confOk) {
            lines.push('❌ 云端连通性：跳过（配置缺失，无法确定云端地址）');
        }
        lines.push('');
        if (sdkOk && confOk && clientOk && conn && conn.ok) {
            lines.push('结论：初始化与云端连接均正常。若仍登录不上，请核对邮箱/密码，或用「忘记密码」重置。');
        } else if (conn && !conn.ok && domConn && domConn.ok) {
            lines.push('结论：登录不了的原因是「云端域名连不上」，不是账号或密码问题，重装/换设备也无效。按上面「处理」操作即可。');
        } else {
            lines.push('结论：上面标 ❌ 的环节就是登录不了的原因（请对照该行的提示处理）。');
        }
        lines.push('（可截图这一页发给开发者）');

        var box = document.getElementById('message');
        box.className = 'message error';
        box.style.whiteSpace = 'pre-wrap';
        box.style.textAlign = 'left';
        box.textContent = lines.join('\n');
    }

    async function initPasswordRecoveryIfNeeded() {
        if (!supabaseClient) return;
        try {
            const hash = window.location.hash || '';
            const search = window.location.search || '';
            // 兼容旧版 implicit 和新版 code flow
            const hasRecovery = hash.includes('type=recovery') || hash.includes('type=magiclink') || search.includes('type=recovery') || search.includes('code=');
            if (!hasRecovery) return;

            // PKCE/code flow: 用 code 换 session
            if (typeof supabaseClient.auth.exchangeCodeForSession === 'function' && search.includes('code=')) {
                await supabaseClient.auth.exchangeCodeForSession(window.location.href);
            }

            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) return;

            // 显示设置新密码 UI
            const card = document.querySelector('.card');
            if (!card) return;
            card.innerHTML = `
                <div style="display:flex;flex-direction:column;gap:10px;">
                    <div style="font-size:13px;color:var(--text-light);">请设置新密码</div>
                    <input type="password" id="newPassword" placeholder="至少6位密码" autocomplete="new-password" />
                    <button type="button" class="btn w-full" onclick="submitNewPassword()">更新密码</button>
                    <div id="message"></div>
                </div>
            `;
        } catch (e) {
            console.error('initPasswordRecoveryIfNeeded error:', e);
        }
    }

    async function submitNewPassword() {
        if (!supabaseClient) return;
        const np = document.getElementById('newPassword')?.value;
        if (!np || np.length < 6) {
            return showMessage('新密码至少6位', 'error');
        }
        showMessage('正在更新密码...', 'success');
        const { error } = await supabaseClient.auth.updateUser({ password: np });
        if (error) {
            return showMessage('更新失败：' + translateAuthError(error.message), 'error');
        }
        showMessage('密码已更新！正在进入系统...', 'success');
        // 清理 URL 上的 recovery 参数，避免重复进入
        try {
            history.replaceState(null, '', window.location.pathname);
        } catch (_) {}
        setTimeout(() => window.location.href = 'index.html#settings', 800);
    }

    async function handleLogout() {
        if (!supabaseClient) return;
        try {
            await supabaseClient.auth.signOut();
        } catch (e) {
            console.error('退出失败:', e);
        }
        window.location.href = 'index.html#settings';
    }

    async function initLoginPage() {
        if (!supabaseClient) return;
        const { data: { session } } = await supabaseClient.auth.getSession();
        const card = document.querySelector('.card');
        if (!card) return;

        if (session && session.user && session.user.email) {
            card.innerHTML = `
                <div style="display:flex;flex-direction:column;gap:10px;">
                    <div>
                        <div style="font-size:13px;color:var(--text-light);margin-bottom:4px;">当前已登录账号</div>
                        <div style="font-size:15px;font-weight:600;word-break:break-all;">${session.user.email}</div>
                    </div>
                    <button type="button" class="btn w-full" onclick="handleLogout()">退出登录</button>
                </div>
            `;
        }
    }

    initPasswordRecoveryIfNeeded();
    initLoginPage();
</script>

</body>
</html>
